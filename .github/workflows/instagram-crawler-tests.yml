name: Instagram crawler tests
on:
  pull_request:
    paths:
      - "app/**"
      - "tests/test_instagram_campaign.py"
      - ".github/workflows/instagram-crawler-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Syntax validation
        run: python -m compileall -q app
      - name: Application import smoke test
        run: python -c "from app.main import app; print(app.title)"
      - name: Run isolated Instagram tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest -q tests/test_instagram_campaign.py
