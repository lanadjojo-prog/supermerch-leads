name: Instagram priority crawler checks
on:
  pull_request:
    branches: [migration/workspace-2-20261015]
    paths:
      - 'app/**'
      - 'tests/test_instagram_engine.py'
      - 'tests/test_replacement_database.py'
      - '.github/workflows/instagram-priority-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Syntax and app smoke test
        run: |
          python -m compileall -q app tests
          python -c 'from app.main import app; print(app.title)'
      - name: Instagram and database regression tests
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: pytest -q tests/test_instagram_engine.py tests/test_replacement_database.py
