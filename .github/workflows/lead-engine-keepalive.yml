name: Run SuperMerch Lead Engine

on:
  schedule:
    - cron: "17,47 9-18 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-lead-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=supermerch-lead-engine")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Wake Render and run this hour's lead batch
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail --silent --show-error \
            --max-time 900 \
            --retry 2 \
            --retry-delay 15 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            https://supermerch-leads.onrender.com/api/internal/scheduled-lead-engine
