name: Lead engine regression checks

on:
  pull_request:
    paths:
      - "app/superfris_leads.py"
      - "app/services/**"
      - "app/lead_categories.py"
      - "tests/test_purchase_intent.py"
      - "app/main.py"
      - "tests/test_superfris_leads.py"
      - ".github/workflows/superfris-checks.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests -p "test_*.py" -v
