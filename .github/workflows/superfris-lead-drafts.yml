name: Superfris lead drafts (disabled until configured)

on:
  workflow_dispatch:
  schedule:
    - cron: "5 7-18 * * *"

jobs:
  prepare-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake isolated Superfris pipeline
        env:
          TOKEN: ${{ secrets.SUPERFRIS_DAILY_JOB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Skipped: configure SUPERFRIS_DAILY_JOB_TOKEN after migration and verification."
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 600 \
            -X POST \
            -H "X-Automation-Token: $TOKEN" \
            https://supermerch-leads-ws2.onrender.com/api/internal/superfris-lead-engine
