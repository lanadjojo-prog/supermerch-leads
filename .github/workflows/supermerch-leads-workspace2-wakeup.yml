name: SuperMerch Leads Workspace 2 wake-up

on:
  schedule:
    # Cover both Dutch winter and summer time; the local-time guard keeps
    # wake-ups inside 09:00-19:00 Europe/Amsterdam.
    - cron: "7 7-18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supermerch-leads-ws2-wake
  cancel-in-progress: false

jobs:
  wake-lead-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check local Amsterdam business-hour window
        id: local_time
        shell: bash
        run: |
          hour="$(TZ=Europe/Amsterdam date +%H)"
          if [ "$hour" -ge 9 ] && [ "$hour" -lt 19 ]; then
            echo "in_business_hours=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_business_hours=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wake active Workspace 2 lead engine (drafts only)
        if: steps.local_time.outputs.in_business_hours == 'true'
        shell: bash
        run: |
          curl --fail --show-error --silent --max-time 160 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://supermerch-leads-ws2.onrender.com/health
