name: Wake SuperMerch Lead Engine (Workspace 2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake active Workspace 2 (Zoho drafts only)
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 150 \
            https://supermerch-leads-ws2.onrender.com/health
