name: Wake SuperMerch Lead Engine

on:
  schedule:
    # GitHub runs scheduled workflows only from the default branch.
    # Twice an hour during the NL business-day window, including CET/CEST.
    - cron: "0,30 7-18 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake active Workspace 2 lead engine (drafts only)
        run: |
          curl --fail --silent --show-error             --retry 3 --retry-delay 10 --retry-all-errors             --connect-timeout 20 --max-time 150             https://supermerch-leads-ws2.onrender.com/health
