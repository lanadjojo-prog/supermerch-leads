name: Wake SuperMerch Lead Engine

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Lead Engine
        run: |
          curl --fail --silent --show-error             --retry 3             --retry-delay 5             --max-time 60             https://supermerch-leads.onrender.com/health
