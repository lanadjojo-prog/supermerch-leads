services:
  - type: web
    name: supermerch-leads
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT app.main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: DEFAULT_COUNTRY
        value: Nederland
      - key: MAX_CRAWL_PAGES
        value: 5
      - key: CRAWL_TIMEOUT_SECONDS
        value: 12
      - key: DATABASE_URL
        fromDatabase:
          name: supermerch-leads-db
          property: connectionString

databases:
  - name: supermerch-leads-db
    region: frankfurt
    plan: free
    databaseName: supermerch_leads
    user: supermerch_leads
